description: |
  Run Android Lint and report issues using reviewdog with SARIF format.
  Ensure SARIF report is enabled in your build.gradle / build.gradle.kts:
    android {
        lint {
            sarifReport = true
        }
    }
usage:
  version: 2.1
  orbs:
    reviewdog: yasuhiroki/reviewdog@0.1.0
  jobs:
    lint:
      docker:
        - image: cimg/android:2026.08
      steps:
        - checkout
        - run:
            name: Run Android Lint
            command: ./gradlew lint
        - reviewdog/setup
        - run:
            name: Run reviewdog with SARIF report
            command: |
              reviewdog \
                -f=sarif \
                -name="android-lint" \
                -reporter="github-pr-review" \
                -filter-mode="added" \
                -fail-level="none" \
                -fail-on-error="false" \
                -level="error" \
                < app/build/reports/lint-results.sarif
  workflows:
    main:
      jobs:
        - lint
